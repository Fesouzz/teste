<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Comuna Esportes</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/components.js" defer></script>

</head>
<body>
    <comuna-navbar></comuna-navbar>

    <div class="page-section" style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; margin-top: 40px;">
        <section>
            <h1 style="font-size: 2.5rem; font-weight: 800; text-transform: uppercase; margin-bottom: 25px;">Fale Conosco</h1>
            <form onsubmit="alert('Mensagem enviada com sucesso!'); return false;">
                <div class="form-group">
                    <label>Seu Nome</label>
                    <input type="text" placeholder="Ex: João Silva" style="padding-left:16px;" required>
                </div>
                <div class="form-group">
                    <label>E-mail de Contato</label>
                    <input type="email" placeholder="Ex: contato@email.com" style="padding-left:16px;" required>
                </div>
                <div class="form-group">
                    <label>Mensagem</label>
                    <textarea rows="5" placeholder="Escreva aqui..." style="padding-left:16px; font-family:inherit;" required></textarea>
                </div>
                <button type="submit" class="btn-primary">Enviar Mensagem</button>
            </form>
        </section>

        <aside style="display: flex; flex-direction: column; gap: 30px; justify-content: center;">
            <div class="group-card" style="gap: 15px; border-color: var(--pill-border);">
                <i class="fas fa-map-marker-alt" style="font-size: 1.5rem; color: var(--accent-pink);"></i>
                <div>
                    <h4 style="text-transform: uppercase; color: #ffffff; margin-bottom: 4px;">Sede Organizadora</h4>
                    <p style="color: var(--text-dim); font-size: 0.95rem;">Zonas Periféricas Integradas<br>São Paulo - SP</p>
                </div>
            </div>
            <div class="group-card" style="gap: 15px; border-color: var(--pill-border);">
                <i class="fas fa-envelope" style="font-size: 1.5rem; color: var(--accent-blue);"></i>
                <div>
                    <h4 style="text-transform: uppercase; color: #ffffff; margin-bottom: 4px;">E-mail</h4>
                    <p style="color: var(--text-dim); font-size: 0.95rem;">contato@comunaesportes.org</p>
                </div>
            </div>
        </aside>
    </div>

    <footer>
        <div class="footer-nav">
            <a href="quem-somos.html">Quem Somos</a>
            <a href="contato.html">Contato</a>
        </div>
        <div class="map-box">
            <iframe src="https://google.com" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
